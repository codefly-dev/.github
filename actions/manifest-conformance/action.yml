name: Manifest bundle conformance
description: Render and verify a plugin's Codefly Core manifest bundle twice.
inputs:
  working-directory:
    description: Plugin directory containing go.mod.
    required: false
    default: .
  output-root:
    description: Directory where both rendered manifest trees are persisted.
    required: true
runs:
  using: composite
  steps:
    - name: Run plugin manifest-bundle conformance
      shell: bash
      env:
        MANIFEST_GUARD_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        MANIFEST_GUARD_OUTPUT_ROOT: ${{ inputs.output-root }}
      run: "${GITHUB_ACTION_PATH}/run.sh"
